# /etc/nginx/sites-available/jewelcrest
# Serves the built React site from /var/www/jewelcrest/current.
# After DNS points here, run:  sudo certbot --nginx -d jewelcrestnoidasec97.com -d www.jewelcrestnoidasec97.com
server {
    listen 80;
    listen [::]:80;
    server_name jewelcrestnoidasec97.com www.jewelcrestnoidasec97.com;

    root /var/www/jewelcrest/current;
    index index.html;

    # Relative redirects (e.g. /thank-you -> /thank-you/) so they keep https and the right host
    absolute_redirect off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Note: a location that sets add_header does not inherit server-level headers,
    # so the security headers are repeated in each block.

    # Hashed JS/CSS/fonts never change: cache for a year
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Images and brochure: cache for 30 days
    location ~* \.(jpg|jpeg|png|webp|svg|pdf)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # The page itself: always revalidate so updates show immediately
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
